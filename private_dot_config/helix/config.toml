[editor]
line-number = "relative"
cursorline = true
color-modes = true
bufferline = "always"
auto-pairs = true # Automatically closes brackets and quotes

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "╎" # Visual vertical lines for code blocks

[editor.lsp]
display-messages = true
  
